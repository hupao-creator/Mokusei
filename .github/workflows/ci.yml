name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: 'Run only pinned native CLIs and system matrices'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Reserve one workflow cohort for this repository; each cohort still runs
  # its native shards in parallel. Queued obsolete revisions exit at scope.
  group: ci-native-capacity-${{ github.repository }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  scope:
    name: Determine verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete changed-path set
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/scope.py --current

  go:
    needs: scope
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) }}
    name: Go / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # scripts/go.sh downloads Go 1.27.3 but rejects non-Darwin/arm64 hosts.
      # setup-go honors go.mod's toolchain directive without changing go.mod.
      - uses: actions/setup-go@v6
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        id: go-cache
        run: |
          go version
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-

      # Ubuntu's standard image provides cc and libsqlite3-dev. Keep this
      # explicit: the runtime uses cgo, and disabling it is not a valid build.
      - name: Check SQLite C toolchain
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: |
          printf '#include <sqlite3.h>\nint main(void) { return sqlite3_libversion_number() == 0; }\n' |
            cc -x c - -lsqlite3 -o "$RUNNER_TEMP/sqlite-check"
          "$RUNNER_TEMP/sqlite-check"

      - name: Go formatting
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: |
          unformatted="$(gofmt -l cmd internal tools)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Architecture, registration and source boundaries
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: go run ./cmd/mokusei-check architecture

      - name: Go vet
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: go vet ./...

      - name: Go build
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: go build ./...

      - name: Verify CI scope, evidence selection and deadline controls
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: python3 scripts/ci/verify-ci-control.py

      - name: Verify Go reporting against real failure and skip fixtures
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: python3 scripts/ci/verify-go-reporting.py

      # Includes the Go half of check-directorytag; -count=1 prevents cached
      # test results from substituting for execution after a cache restore.
      # devtool's rotation tests call Darwin-only native profile leases; they
      # run in the macOS job. All packages are still built and vetted above.
      # Bound package concurrency for process/deadline fixtures on standard runners.
      - name: Go unit tests (including directory tags)
        if: ${{ !cancelled() && needs.scope.outputs.documentation_only != 'true' }}
        run: |
          packages="$(go list ./cmd/... ./internal/... ./tools/verification/thread-search ./tools/verification/applicationhost)"
          portable_packages=()
          while IFS= read -r package; do
            if [[ "$package" != */internal/tooling/devtool ]]; then
              portable_packages+=("$package")
            fi
          done <<< "$packages"
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-go/unit" -- \
            go test -json -p 2 -count=1 "${portable_packages[@]}"

      - name: Go module race tests (check-modules)
        if: ${{ !cancelled() && needs.scope.outputs.documentation_only != 'true' }}
        run: >-
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-go/modules" --
          go test -json -race -p 2 -count=1
          ./internal/plugins/... ./internal/hosts/... ./internal/core/runtime
          ./internal/services/moku ./internal/platform/discovery ./internal/platform/environment

      - name: Runtime and Codex integration properties (pbt)
        if: ${{ !cancelled() && needs.scope.outputs.documentation_only != 'true' }}
        run: >-
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-go/properties" --
          go test -json -race -count=1
          ./tools/verification/runtime-concurrency ./tools/verification/codex
          -run Properties

      - name: Summarize Go tests and enforce execution
        if: ${{ always() && needs.scope.outputs.documentation_only != 'true' }}
        run: >-
          python3 scripts/ci/go-tests.py report --output "$RUNNER_TEMP/ci-go/summary.json"
          "$RUNNER_TEMP/ci-go/unit" "$RUNNER_TEMP/ci-go/modules" "$RUNNER_TEMP/ci-go/properties"

      - name: Retain Go test evidence
        if: ${{ always() && needs.scope.outputs.documentation_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: go-linux-test-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-go
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm documentation-only validation
        if: ${{ needs.scope.outputs.documentation_only == 'true' }}
        run: echo 'Documentation-only diff validated by the scope job; no Go execution required.' >> "$GITHUB_STEP_SUMMARY"

  replays:
    needs: scope
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
    name: Integration / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [runtime, adapters]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/ci/replays.py "${{ matrix.group }}" --output "$RUNNER_TEMP/replays"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: integration-${{ matrix.group }}-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/replays
          if-no-files-found: error
          retention-days: 7

  native-go:
    needs: scope
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
    name: Native Go and Swift fixture preparation
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      cache: ${{ steps.go-cache.outputs.key }}
      modules: ${{ steps.go-cache.outputs.modules }}
      build: ${{ steps.go-cache.outputs.build }}
      evidence: ${{ steps.go-cache.outputs.evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Locate this attempt's native Go cache
        id: go-cache
        run: |
          printf 'evidence=macos-preparation-evidence-attempt-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'key=native-go-%s-%s-%s\n' "$RUNNER_ARCH" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Warm the native Go replay build cache
        run: |
          python3 scripts/ci/deadline.py go build -race ./tools/verification/...
          python3 scripts/ci/deadline.py go build ./cmd/mokusei-runtime ./cmd/mokusei-dev
      - name: Native Go module and development-tool tests
        run: |
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/preparation/ci-native-go/moku" -- go test -json -race -count=1 ./internal/services/moku
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/preparation/ci-native-go/devtool" -- go test -json -count=1 ./internal/tooling/devtool
      - name: Enforce native Go execution
        if: ${{ always() }}
        run: |
          python3 scripts/ci/go-tests.py report --output "$RUNNER_TEMP/preparation/ci-native-go/summary.json" "$RUNNER_TEMP/preparation/ci-native-go/moku" "$RUNNER_TEMP/preparation/ci-native-go/devtool"
      - name: Generate actual Go projections for Swift consumers
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/replays.py fixtures --output "$RUNNER_TEMP/preparation/ci-fixtures"
      # setup-go's immutable dependency key may restore an older source build.
      # Share this attempt's warmed race AND ordinary caches with the consumers.
      - uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-cache.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-preparation-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preparation
          if-no-files-found: error
          retention-days: 7

  swift-build:
    needs: scope
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
    name: Swift build and complete test inventory
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      cache: ${{ steps.restore.outputs.cache-primary-key }}
      developer: ${{ steps.toolchain.outputs.developer }}
      attempt: ${{ steps.toolchain.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the native toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            python3 scripts/ci/deadline.py xcodebuild -downloadComponent MetalToolchain
          fi
          printf 'fingerprint=%s\n' "$(python3 scripts/ci/swift-shards.py fingerprint)" >> "$GITHUB_OUTPUT"
          printf 'developer=%s\n' "$(xcode-select -p)" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: app/macos/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-
      - name: Build current sources and all test targets
        run: |
          mkdir -p "$RUNNER_TEMP/build-evidence"
          set -o pipefail
          python3 scripts/ci/deadline.py xcrun swift build --package-path app/macos --build-tests --force-resolved-versions --disable-index-store 2>&1 | tee "$RUNNER_TEMP/build-evidence/build.log"
          python3 scripts/ci/deadline.py xcrun swiftc scripts/ci/native-environment.swift -o app/macos/.build/ci-native-environment
          python3 scripts/ci/swift-shards.py prepare
          cp app/macos/.build/ci-manifest.json "$RUNNER_TEMP/build-evidence/build-manifest.json"
      # The unique run/attempt key transports this successful build to consumers.
      # It is never evidence that tests passed, and future builders always build.
      - uses: actions/cache/save@v4
        with:
          path: app/macos/.build
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-build-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-evidence
          if-no-files-found: error
          retention-days: 7

  mac:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
    name: macOS / ${{ matrix.name }}
    needs: [scope, swift-build, native-go]
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Five is the standard hosted macOS concurrency allowance.
      max-parallel: 5
      matrix:
        include:
          - {name: swift-0, shard: '0', replay: interop-wire, go: true}
          - {name: swift-1, shard: '1', replay: interop-process, go: true}
          - {name: swift-2, shard: '2', replay: native-controls, go: false}
          - {name: swift-3, shard: '3', replay: native-capture, go: false}
          - {name: swift-4, shard: '4', replay: native-runtime, go: true}
    env:
      DEVELOPER_DIR: ${{ needs.swift-build.outputs.developer }}
      MOKUSEI_SWIFT_BUILD_ATTEMPT: ${{ needs.swift-build.outputs.attempt }}
      MOKUSEI_SWIFT_SKIP_BUILD: '1'
      MOKUSEI_OVERVIEW_SEARCH_NATIVE_REPLAY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        if: ${{ matrix.go }}
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        if: ${{ matrix.go }}
        with:
          path: |
            ${{ needs.native-go.outputs.modules }}
            ${{ needs.native-go.outputs.build }}
          key: ${{ needs.native-go.outputs.cache }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: app/macos/.build
          key: ${{ needs.swift-build.outputs.cache }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native-go.outputs.evidence }}
          path: ${{ runner.temp }}/preparation
      - name: Verify the shared build and graphical session
        run: |
          python3 scripts/ci/swift-shards.py verify --evidence "$RUNNER_TEMP/evidence"
          printf '%s\n' "MOKUSEI_INITIAL_RESPONSE_FIXTURES=$RUNNER_TEMP/preparation/ci-fixtures/initial-response.json" >> "$GITHUB_ENV"
          printf '%s\n' "MOKU_STATUS_NATIVE_FIXTURE=$RUNNER_TEMP/preparation/ci-fixtures/moku-status.json" >> "$GITHUB_ENV"
          printf '%s\n' "MOKU_TIMER_NATIVE_FIXTURE=$RUNNER_TEMP/preparation/ci-fixtures/moku-timer.json" >> "$GITHUB_ENV"
          printf '%s\n' "MOKUSEI_VOICE_EVENT_EXPORT=$RUNNER_TEMP/preparation/ci-fixtures/voice-events.json" >> "$GITHUB_ENV"
          printf '%s\n' "MOKUSEI_CONVERSATION_CONTRACT_EXPORT=$RUNNER_TEMP/preparation/ci-fixtures/conversation.json" >> "$GITHUB_ENV"
          printf '%s\n' "MOKUSEI_HARNESS_FORM_FIXTURE=$RUNNER_TEMP/preparation/ci-fixtures/harness-forms.json" >> "$GITHUB_ENV"
          # Only the disposable runner account is changed. The stock image
          # disables both effects, which invalidates real animation/glass tests.
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          app/macos/.build/ci-native-environment
      - name: Run every assigned Swift method exactly once
        run: python3 scripts/ci/swift-shards.py run --shard "${{ matrix.shard }}" --evidence "$RUNNER_TEMP/evidence"
      - name: Run independent production-boundary replays
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/replays.py "${{ matrix.replay }}" --output "$RUNNER_TEMP/evidence/ci-${{ matrix.replay }}"
      - name: Collect native captures and logs
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence/native-captures"
          for path in .scratch/reading-presentation .scratch/moku-note-production; do
            if [[ -d "$path" ]]; then cp -R "$path" "$RUNNER_TEMP/evidence/native-captures/"; fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-${{ matrix.name }}-evidence-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/**/mokusei-runtime
          if-no-files-found: error
          retention-days: 7

  external:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
    name: Native CLI / ${{ matrix.kind }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {kind: codex, package: '@openai/codex@0.163.0'}
          - {kind: pi, package: '@earendil-works/pi-coding-agent@1.0.0'}
          - {kind: opencode, package: '@opencode/cli@2.0.25'}
          - {kind: system, package: '@openai/codex@0.163.0'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        id: cli
        with:
          path: ${{ runner.temp }}/cli
          key: pinned-native-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}
      - name: Install only this runner's pinned native CLI
        if: ${{ steps.cli.outputs.cache-hit != 'true' }}
        timeout-minutes: 3
        env:
          CLI_PACKAGE: ${{ matrix.package }}
        run: |
          python3 scripts/ci/deadline.py npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=1 "$CLI_PACKAGE"
      - uses: actions/cache/save@v4
        if: ${{ steps.cli.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/cli
          key: ${{ steps.cli.outputs.cache-primary-key }}
      - name: Expose the pinned native CLI
        run: printf '%s\n' "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Locate the actual Codex executable
        if: ${{ matrix.kind == 'codex' || matrix.kind == 'system' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cli/node_modules'
          binaries = [path for path in root.rglob('codex') if path.is_file()
                      and not path.is_symlink() and os.access(path, os.X_OK)
                      and path.open('rb').read(4) in (b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe')]
          if len(binaries) != 1:
              raise SystemExit(f'Expected one native Codex binary, found {binaries}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MOKUSEI_SYSTEM_CODEX={binaries[0]}\n')
          PY
      - name: Execute the native CLI or full system matrix
        env:
          CLI_KIND: ${{ matrix.kind }}
        run: |
          mkdir -p "$RUNNER_TEMP/external"
          set -o pipefail
          case "$CLI_KIND" in
            codex) python3 scripts/ci/deadline.py go run -race ./tools/verification/codex -real-only -real-codex "$MOKUSEI_SYSTEM_CODEX" ;;
            pi) python3 scripts/ci/deadline.py go run -race ./tools/verification/pi -mode native -timeout 7m ;;
            opencode) python3 scripts/ci/deadline.py go run -race ./tools/verification/opencode -native-cli "$(command -v opencode)" ;;
            system) python3 scripts/ci/deadline.py make check-system GO=go ;;
          esac 2>&1 | tee "$RUNNER_TEMP/external/$CLI_KIND.log"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-cli-${{ matrix.kind }}-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external
          if-no-files-found: error
          retention-days: 7

  verification:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.extended && 'Extended native CLI coverage' || 'Complete coverage' }}
    if: ${{ always() }}
    needs: [scope, go, replays, native-go, swift-build, mac, external]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select artifact IDs before downloading retry evidence
        id: evidence
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 scripts/ci/collect-evidence.py --plan "$RUNNER_TEMP/artifacts.json"
      - uses: actions/download-artifact@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact_ids }}
          path: ${{ runner.temp }}/history
      - name: Select each native job's newest execution evidence
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/collect-evidence.py "$RUNNER_TEMP/history" "$RUNNER_TEMP/collected"
      - name: Enforce complete Swift and replay execution
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
        env:
          MOKUSEI_CI_EVIDENCE: ${{ runner.temp }}/collected
        run: python3 scripts/ci/swift-tests.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.extended) && needs.scope.outputs.documentation_only != 'true' }}
        with:
          name: swift-coverage-summary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report queueing and retries
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/run-summary.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: run-summary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce every required job
        if: ${{ always() }}
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          DOCUMENTATION_ONLY: ${{ needs.scope.outputs.documentation_only }}
          EXTENDED: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          required = ['scope', 'external'] if os.environ['EXTENDED'] == 'true' else ['scope', 'go']
          if os.environ['EXTENDED'] != 'true' and os.environ['DOCUMENTATION_ONLY'] != 'true':
              required += ['replays', 'native-go', 'swift-build', 'mac']
          failures = [name for name in required if results[name]['result'] != 'success']
          message = f'Required jobs failed/skipped: {failures}. Elapsed time is diagnostic, not a merge gate.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n' + message + '\n')
          if failures:
              raise SystemExit(1)
          PY
