name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Latest PR/main revision wins. Explicit dispatches own an independent group.
  # GitHub records obsolete work as cancelled; it never becomes a green gate.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  scope:
    name: Determine verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete changed-path set
        id: scope
        run: python3 scripts/ci/scope.py

  go:
    needs: scope
    name: Go / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        with:
          cache-scope: static

      - name: Go formatting
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: |
          unformatted="$(gofmt -l cmd internal tools)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Architecture, registration and source boundaries
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: go run ./cmd/mokusei-check architecture

      - name: Go vet
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: go vet ./...

      - name: Go build
        if: ${{ needs.scope.outputs.documentation_only != 'true' }}
        run: go build ./...

      - name: Confirm documentation-only validation
        if: ${{ needs.scope.outputs.documentation_only == 'true' }}
        run: echo 'Documentation-only diff validated; builds are outside this scope.' >> "$GITHUB_STEP_SUMMARY"

  mac:
    needs: scope
    if: ${{ needs.scope.outputs.documentation_only != 'true' }}
    name: macOS / Build
    runs-on: ${{ fromJSON(vars.MOKUSEI_SELF_HOSTED_MACOS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","ARM64","mokusei-macos-26-gui"]' || '["macos-26"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner platform
        run: python3 scripts/ci/macos-runner-preflight.py
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: native-build
      - name: Prepare Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            python3 scripts/ci/deadline.py xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: actions/cache@v4
        with:
          path: app/macos/.build
          key: swift-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-
      - name: Build current Go sources on Darwin
        run: go build ./...
      - name: Build current Swift products
        run: python3 scripts/ci/deadline.py xcrun swift build --package-path app/macos -Xswiftc -warnings-as-errors

  verification:
    name: Complete coverage
    if: ${{ always() }}
    needs: [scope, go, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Timing diagnostics cannot invalidate successful verification when the
      # Actions metadata service is unavailable. Required jobs are enforced below.
      - name: Report queueing and retries
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/run-summary.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: run-summary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce required build and static checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          DOCUMENTATION_ONLY: ${{ needs.scope.outputs.documentation_only }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          required = ['scope', 'go']
          if os.environ['DOCUMENTATION_ONLY'] != 'true':
              required.append('mac')
          failures = [name for name in required if results[name]['result'] != 'success']
          if failures:
              raise SystemExit(f'Required checks failed/skipped: {failures}')
          print('Build and static checks passed; no test suites are configured.')
          PYTHON
