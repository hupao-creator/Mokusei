name: Native observation A/B diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: observer-ab-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  observer:
    name: Native observation A/B
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MOKUSEI_OVERVIEW_SEARCH_NATIVE_REPLAY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare actual native toolchain
        id: toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/observer-ab"
          echo "MOKUSEI_NATIVE_MODULE_CACHE=$RUNNER_TEMP/native-module-cache" >> "$GITHUB_ENV"
          echo "MOKUSEI_CI_EVIDENCE=$RUNNER_TEMP/observer-ab/build-evidence" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          sysctl hw.ncpu hw.memsize
          if ! xcrun --sdk macosx metal --version; then
            python3 scripts/ci/deadline.py xcodebuild -downloadComponent MetalToolchain
          fi
          echo "fingerprint=$(python3 scripts/ci/swift-native.py fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: app/macos/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-native-seed-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-native-
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-
      - name: Build and identify current production modules
        run: |
          set -o pipefail
          python3 scripts/ci/deadline.py xcrun swift build --package-path app/macos --build-tests --force-resolved-versions --disable-index-store 2>&1 | tee "$RUNNER_TEMP/observer-ab/build.log"
          python3 scripts/ci/deadline.py xcrun swiftc scripts/ci/native-environment.swift -o app/macos/.build/ci-native-environment
          python3 scripts/ci/swift-native.py prepare
          python3 scripts/ci/swift-native.py verify --evidence "$MOKUSEI_CI_EVIDENCE"
      - name: Verify actual graphical session
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          app/macos/.build/ci-native-environment
      - name: Run every original assertion in balanced A B B A order
        env:
          MOKUSEI_SWIFT_SKIP_BUILD: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone

          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'observer-ab'
          control = '916fd3299a76cb6a60c7bc8779e8c40e8cdeb38d'
          paths = [Path(p) for p in [
              'app/macos/Tests/Support/NativeTestEnvironment.swift',
              'app/macos/Tests/Integration/Host/SwiftUIReplaySupport.swift',
              'app/macos/Tests/Integration/Host/SwiftUIOverviewInteractionTests.swift',
              'app/macos/Tests/Integration/Host/NativeReadingPagePresentationTests.swift',
          ]]
          candidate = {p: p.read_bytes() for p in paths}
          baseline = {p: subprocess.check_output(['git', 'show', f'{control}:{p}']) for p in paths}
          report = {
              'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'controlSourceRef': control,
              'purpose': 'Diagnostic only; no Complete coverage or full-suite claim',
              'sourceSHA256': {name: {str(p): hashlib.sha256(data).hexdigest() for p, data in inputs.items()}
                               for name, inputs in [('A', baseline), ('B', candidate)]},
              'records': [{'condition': label, 'status': 'not_run'} for label in ['A', 'B', 'B', 'A']],
          }
          def save():
              (output / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          save()
          capture = root / '.scratch/reading-presentation/NativeOverviewTagGlassTests'
          try:
              for index, record in enumerate(report['records']):
                  inputs = baseline if record['condition'] == 'A' else candidate
                  for path, data in inputs.items():
                      path.write_bytes(data)
                  subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', 'app/macos/Sources',
                                  'app/macos/Plugins', 'app/macos/Package.swift', 'app/macos/Package.resolved'], check=True)
                  if capture.exists():
                      shutil.rmtree(capture)
                  directory = output / f"{index + 1}-{record['condition']}"
                  directory.mkdir()
                  record.update(status='running', startedAt=datetime.now(timezone.utc).isoformat())
                  save()
                  start = time.monotonic()
                  with (directory / 'command.log').open('w') as log:
                      result = subprocess.run([sys.executable, 'scripts/ci/replays.py', 'native',
                          '--check', 'tag-glass-captures', '--output', str(directory / 'replays')],
                          stdout=log, stderr=subprocess.STDOUT)
                  record.update(exitCode=result.returncode, seconds=round(time.monotonic() - start, 3),
                                status='passed' if result.returncode == 0 else 'failed',
                                finishedAt=datetime.now(timezone.utc).isoformat())
                  record['capturePresent'] = capture.exists()
                  if capture.exists():
                      shutil.copytree(capture, directory / 'capture')
                  save()
                  print(json.dumps(record), flush=True)
          finally:
              for path, data in candidate.items():
                  path.write_bytes(data)
              save()
          # Retain all failures, including control failures. A diagnostic green
          # cannot hide a failed condition or substitute for required PR CI.
          raise SystemExit(1 if any(r['status'] != 'passed' for r in report['records']) else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: observer-ab-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observer-ab
          if-no-files-found: error
          retention-days: 7
