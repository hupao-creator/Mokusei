# Temporary diagnostic branch only. Never merge this workflow into a PR or main.
name: Native scroll diagnosis (not merge gate)
'on':
  push:
    branches:
    - diagnostic/native-scroll-331-20261114
permissions:
  contents: read
  actions: read
concurrency:
  group: native-scroll-diagnosis-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
jobs:
  diagnosis:
    name: Native scroll diagnosis (not merge gate)
    runs-on: ${{ fromJSON(vars.MOKUSEI_SELF_HOSTED_MACOS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","ARM64","mokusei-macos-26-gui"]' || '["macos-26"]') }}
    timeout-minutes: 60
    steps:
    - name: Prepare native evidence directory
      run: |
        mkdir -p "$RUNNER_TEMP/native-scroll-diagnosis"
        printf 'MOKUSEI_CI_EVIDENCE=%s/native-scroll-diagnosis\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify runner platform
      run: python3 scripts/ci/macos-runner-preflight.py
    - uses: ./.github/actions/setup-go
      with:
        cache-scope: native
    - name: Prepare the native toolchain
      id: toolchain
      run: |
        mkdir -p "$MOKUSEI_CI_EVIDENCE"
        sw_vers
        xcodebuild -version
        if ! xcrun --sdk macosx metal --version; then
          python3 scripts/ci/deadline.py xcodebuild -downloadComponent MetalToolchain
        fi
        printf 'fingerprint=%s\n' "$(python3 scripts/ci/swift-native.py fingerprint)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: swift-cache
      with:
        path: app/macos/.build
        key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-native-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-native-
          ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-
    - name: Build current Swift sources and discover every test
      id: swift-build
      run: |
        set -o pipefail
        python3 scripts/ci/deadline.py python3 scripts/ci/swift-native.py build 2>&1 | tee "$MOKUSEI_CI_EVIDENCE/build.log"
        python3 scripts/ci/deadline.py xcrun swiftc scripts/ci/native-environment.swift -o app/macos/.build/ci-native-environment
        python3 scripts/ci/swift-native.py prepare
        python3 scripts/ci/swift-native.py verify --evidence "$MOKUSEI_CI_EVIDENCE"
        printf 'MOKUSEI_SWIFT_SKIP_BUILD=1\n' >> "$GITHUB_ENV"
    - name: Verify the graphical session
      if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
      run: |
        # Self-hosted images must already have the required display policy.
        # Never rewrite a persistent account's accessibility preferences.
        if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
        fi
        app/macos/.build/ci-native-environment
    - name: Run at most eight isolated native rounds, stopping at first failure
      if: ${{ success() && steps.swift-build.outcome == 'success' }}
      run: |
        python3 - <<'PY'
        import datetime
        import json
        import os
        from pathlib import Path
        import shutil
        import signal
        import subprocess
        import sys
        import time

        repo = Path.cwd()
        sys.path.insert(0, str(repo / "scripts/ci"))
        import deadline

        signal.signal(signal.SIGTERM, lambda *_: sys.exit("Diagnostic native owner terminated"))
        evidence = Path(os.environ["MOKUSEI_CI_EVIDENCE"])
        export = repo / ".scratch/reading-presentation/NativeMokuExecutionLinkTests"
        command = [sys.executable, "tools/verification/reading-presentation/run.py",
                   "--moku-execution-links", "--native-owned"]
        receipt = {
            "purpose": "bounded native scroll diagnosis; not merge acceptance",
            "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
            "run": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "timeline_profile": os.environ.get("MOKUSEI_TIMELINE_PROFILE"),
            "command": command,
            "whole_command_timeout_seconds": 300,
            "appkit_timeout_seconds": 90,
            "maximum_rounds": 8,
            "stop_on_first_failure": True,
            "rounds": [],
        }
        summary = evidence / "diagnostic-summary.json"
        summary.write_text(json.dumps(receipt, indent=2) + "\n")
        for number in range(1, 9):
            target = evidence / f"round-{number:02d}"
            target.mkdir()
            # The previous export is already copied into its round. Removing the shared
            # destination prevents a launch error from reusing stale evidence.
            if export.exists():
                shutil.rmtree(export)
            began = datetime.datetime.now(datetime.timezone.utc).isoformat()
            started = time.monotonic()
            print(f"DIAGNOSTIC ROUND {number}/8 BEGIN {began}", flush=True)
            timeout_error = None
            with (target / "process.log").open("w") as output:
                try:
                    returncode = deadline.run(command, timeout=300, cwd=repo, stdout=output,
                                              stderr=subprocess.STDOUT)
                except TimeoutError as error:
                    returncode = 124
                    timeout_error = str(error)
                    output.write(timeout_error + "\n")
            if export.exists():
                shutil.copytree(export, target / "native-export")
            record = {"round": number, "started_at": began,
                      "elapsed_seconds": round(time.monotonic() - started, 3),
                      "returncode": returncode, "timeout_error": timeout_error,
                      "log": f"round-{number:02d}/process.log"}
            (target / "result.json").write_text(json.dumps(record, indent=2) + "\n")
            receipt["rounds"].append(record)
            receipt["outcome"] = "failed; stopped at first failure" if returncode else "collecting"
            summary.write_text(json.dumps(receipt, indent=2) + "\n")
            print(f"DIAGNOSTIC ROUND {number}/8 END returncode={returncode} elapsed={record['elapsed_seconds']}s", flush=True)
            if returncode:
                with (target / "process.log").open() as output:
                    for line in output:
                        if "recorded an issue" in line:
                            print(line, end="", flush=True)
                raise SystemExit(1)
        receipt["outcome"] = "no failure observed in eight bounded rounds; not merge acceptance"
        summary.write_text(json.dumps(receipt, indent=2) + "\n")
        print(receipt["outcome"], flush=True)
        PY
      env:
        MOKUSEI_TIMELINE_PROFILE: '1'
    - name: Record diagnostic scope
      if: ${{ always() }}
      run: |
        printf '# Native scroll diagnosis (not merge gate)\n\n' >> "$GITHUB_STEP_SUMMARY"
        printf 'This run only diagnoses the declared moku-execution-links native owner. It does not certify complete coverage or authorize merging. See the artifact for each bounded round.\n' >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: native-scroll-diagnosis-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-scroll-diagnosis
        if-no-files-found: error
        retention-days: 7
