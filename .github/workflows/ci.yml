name: Ordinary and native direction diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ordinary-direction-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  MOKUSEI_OVERVIEW_SEARCH_NATIVE_REPLAY: '1'

jobs:
  compare:
    name: Ordinary and native direction diagnostic
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Prepare native evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/direction-evidence"
          printf 'MOKUSEI_CI_EVIDENCE=%s/direction-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MOKUSEI_NATIVE_MODULE_CACHE=%s/native-module-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare native toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            python3 scripts/ci/deadline.py xcodebuild -downloadComponent MetalToolchain
          fi
          printf 'fingerprint=%s\n' "$(python3 scripts/ci/swift-native.py fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: app/macos/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-native-seed-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-native-
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-
      - name: Build and identify current native sources
        id: build
        run: |
          set -o pipefail
          python3 scripts/ci/deadline.py xcrun swift build --package-path app/macos --build-tests --force-resolved-versions --disable-index-store 2>&1 | tee "$MOKUSEI_CI_EVIDENCE/build.log"
          python3 scripts/ci/deadline.py xcrun swiftc scripts/ci/native-environment.swift -o app/macos/.build/ci-native-environment
          python3 scripts/ci/swift-native.py prepare
          python3 scripts/ci/swift-native.py verify --evidence "$MOKUSEI_CI_EVIDENCE"
          printf 'MOKUSEI_SWIFT_SKIP_BUILD=1\n' >> "$GITHUB_ENV"
      - name: Verify graphical session
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          app/macos/.build/ci-native-environment
      - name: Native Go module and development-tool tests
        run: |
          python3 scripts/ci/go-tests.py run "$MOKUSEI_CI_EVIDENCE/ci-native-go/moku" -- go test -json -race -count=1 ./internal/services/moku
          python3 scripts/ci/go-tests.py run "$MOKUSEI_CI_EVIDENCE/ci-native-go/devtool" -- go test -json -count=1 ./internal/tooling/devtool
      - name: Generate actual Go projections for Swift consumers
        id: fixtures
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/replays.py fixtures --output "$MOKUSEI_CI_EVIDENCE/ci-fixtures"
      - name: Run the complete ordinary Swift suite once
        id: ordinary
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: python3 scripts/ci/swift-native.py run --evidence "$MOKUSEI_CI_EVIDENCE"
      - name: Run original native rolling owner after ordinary suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: python3 scripts/ci/replays.py native --check rolling-numbers --output "$RUNNER_TEMP/rolling-replay"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ordinary-direction-diagnostic-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/direction-evidence
            ${{ runner.temp }}/rolling-replay
            .scratch/reading-presentation/RollingNumberCellTests
          if-no-files-found: error
          retention-days: 7
