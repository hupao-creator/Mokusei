name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: 'Also run pinned native CLIs, system matrices and the full 30-minute stability gate'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # scripts/go.sh downloads Go 1.27.3 but rejects non-Darwin/arm64 hosts.
      # setup-go honors go.mod's toolchain directive without changing go.mod.
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          go version
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-

      # Ubuntu's standard image provides cc and libsqlite3-dev. Keep this
      # explicit: the runtime uses cgo, and disabling it is not a valid build.
      - name: Check SQLite C toolchain
        run: |
          printf '#include <sqlite3.h>\nint main(void) { return sqlite3_libversion_number() == 0; }\n' |
            cc -x c - -lsqlite3 -o "$RUNNER_TEMP/sqlite-check"
          "$RUNNER_TEMP/sqlite-check"

      - name: Go formatting
        run: |
          unformatted="$(gofmt -l cmd internal tools)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Architecture, registration and source boundaries
        run: go run ./cmd/mokusei-check architecture

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Verify Go reporting against real failure and skip fixtures
        run: python3 scripts/ci/verify-go-reporting.py

      # Includes the Go half of check-directorytag; -count=1 prevents cached
      # test results from substituting for execution after a cache restore.
      # devtool's rotation tests call Darwin-only native profile leases; they
      # run in the macOS job. All packages are still built and vetted above.
      # Bound package concurrency for process/deadline fixtures on standard runners.
      - name: Go unit tests (including directory tags)
        if: ${{ !cancelled() }}
        run: |
          packages="$(go list ./cmd/... ./internal/... ./tools/verification/thread-search ./tools/verification/applicationhost)"
          portable_packages=()
          while IFS= read -r package; do
            if [[ "$package" != */internal/tooling/devtool ]]; then
              portable_packages+=("$package")
            fi
          done <<< "$packages"
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-go/unit" -- \
            go test -json -p 2 -count=1 "${portable_packages[@]}"

      - name: Go module race tests (check-modules)
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-go/modules" --
          go test -json -race -p 2 -count=1
          ./internal/plugins/... ./internal/hosts/... ./internal/core/runtime
          ./internal/services/moku ./internal/platform/discovery ./internal/platform/environment

      - name: Runtime and Codex integration properties (pbt)
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-go/properties" --
          go test -json -race -count=1
          ./tools/verification/runtime-concurrency ./tools/verification/codex
          -run Properties

      - name: Summarize Go tests and enforce execution
        if: ${{ always() }}
        run: >-
          python3 scripts/ci/go-tests.py report --output "$RUNNER_TEMP/ci-go/summary.json"
          "$RUNNER_TEMP/ci-go/unit" "$RUNNER_TEMP/ci-go/modules" "$RUNNER_TEMP/ci-go/properties"

      - name: Retain Go test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-linux-test-evidence
          path: ${{ runner.temp }}/ci-go
          if-no-files-found: warn
          retention-days: 14

  external:
    name: Native CLIs and 30-minute stability / macOS
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the verified external CLI versions in temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund \
            @openai/codex@0.163.0 @earendil-works/pi-coding-agent@1.0.0 @opencode/cli@2.0.25
          printf '%s\n' "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cli/node_modules'
          binaries = [path for path in root.rglob('codex') if path.is_file()
                      and not path.is_symlink() and os.access(path, os.X_OK)
                      and path.open('rb').read(4) in (b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe')]
          if len(binaries) != 1:
              raise SystemExit(f'Expected one native Codex binary, found {binaries}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MOKUSEI_SYSTEM_CODEX={binaries[0]}\n')
          PY
      - name: Native CLI protocol and system verification
        run: |
          mkdir -p "$RUNNER_TEMP/extended"
          set -o pipefail
          node --version
          "$MOKUSEI_SYSTEM_CODEX" --version
          pi --version
          opencode --version
          go run -race ./tools/verification/codex -real-only -real-codex "$MOKUSEI_SYSTEM_CODEX" 2>&1 | tee "$RUNNER_TEMP/extended/codex.log"
          go run -race ./tools/verification/pi -mode native -timeout 10m 2>&1 | tee "$RUNNER_TEMP/extended/pi.log"
          go run -race ./tools/verification/opencode -native-cli "$(command -v opencode)" 2>&1 | tee "$RUNNER_TEMP/extended/opencode.log"
          make check-system GO=go 2>&1 | tee "$RUNNER_TEMP/extended/system.log"
      - name: Real crash recovery and full stability qualification
        if: ${{ !cancelled() && env.MOKUSEI_SYSTEM_CODEX != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/extended"
          set -o pipefail
          STABILITY_OUTPUT="$RUNNER_TEMP/extended/stability" make check-stability GO=go 2>&1 | tee "$RUNNER_TEMP/extended/stability.log"
      - name: Retain native CLI and stability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: extended-native-evidence
          path: ${{ runner.temp }}/extended
          if-no-files-found: error
          retention-days: 14

  replays:
    name: Integration / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [runtime, adapters]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The Console OAuth replay evaluates the shipped native-client JS in Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay production boundaries against isolated peers
        run: python3 scripts/ci/replays.py "${{ matrix.group }}" --output "$RUNNER_TEMP/replays"
      - name: Retain replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.group }}-evidence
          path: ${{ runner.temp }}/replays
          if-no-files-found: error
          retention-days: 14

  swift:
    name: Swift UI and native Go / macOS
    # Package.swift and the Metal plugin require macOS 26. macos-15/14 can
    # neither run these test binaries nor validate their AppKit behavior.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          go version
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-

      # check-modules includes a Darwin-only JXA/AppKit clipboard bridge test.
      # Linux tests the unsupported-platform branch instead.
      - name: Native Go module race tests
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-native-go/moku" --
          go test -json -race -count=1 ./internal/services/moku

      - name: Native development tool unit tests
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/ci/go-tests.py run "$RUNNER_TEMP/ci-native-go/devtool" --
          go test -json -count=1 ./internal/tooling/devtool

      - name: Summarize native Go tests and enforce execution
        if: ${{ always() }}
        run: >-
          python3 scripts/ci/go-tests.py report --output "$RUNNER_TEMP/ci-native-go/summary.json"
          "$RUNNER_TEMP/ci-native-go/moku" "$RUNNER_TEMP/ci-native-go/devtool"

      - name: Prepare Xcode and Metal toolchain
        if: ${{ !cancelled() }}
        id: xcode
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          xcodebuild -version
          xcrun swift --version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          fingerprint="$({ xcodebuild -version; xcrun swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d' ' -f1)"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: app/macos/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('app/macos/Package.swift', 'app/macos/Package.resolved') }}-

      # Always build, even on a cache hit. --skip-build below refers only to
      # this run's successful build, never directly to restored test binaries.
      - name: Swift build (including test targets)
        id: swift-build
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        working-directory: app/macos
        run: xcrun swift build --build-tests --force-resolved-versions

      - name: Generate cross-language Swift fixtures
        if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
        run: python3 scripts/ci/replays.py fixtures --output "$RUNNER_TEMP/ci-fixtures"

      - name: Swift full test suite
        if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: app/macos
        env:
          MOKUSEI_OVERVIEW_SEARCH_NATIVE_REPLAY: '1'
        run: |
          set -o pipefail
          # AppKit fixtures share application/window state across suites.
          xcrun swift test --skip-build --no-parallel 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"

      - name: Go and Swift interoperability and native process lifecycle
        if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
        run: python3 scripts/ci/replays.py interop --output "$RUNNER_TEMP/ci-interop"

      - name: Isolated native user flows
        if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
        run: python3 scripts/ci/replays.py native --output "$RUNNER_TEMP/ci-native"

      - name: Summarize Swift tests and enforce execution
        if: ${{ always() }}
        run: |
          python3 scripts/ci/swift-tests.py

      - name: Retain native test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-evidence
          path: |
            ${{ runner.temp }}/ci-native-go
            ${{ runner.temp }}/ci-fixtures
            ${{ runner.temp }}/ci-interop
            ${{ runner.temp }}/ci-native
            ${{ runner.temp }}/swift-tests.log
            ${{ runner.temp }}/swift-summary.json
            .scratch/reading-presentation
            .scratch/moku-note-production
          if-no-files-found: warn
          retention-days: 14
