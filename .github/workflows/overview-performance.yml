name: Overview performance

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/macos/Sources/Host/Overview/**'
      - 'app/macos/Sources/Shared/PluginUI/Cards/**'
      - 'app/macos/Sources/Shared/PluginUI/Design/**'
      - 'app/macos/Sources/Shared/PluginUI/Shaders/**'
      - 'app/macos/Sources/Core/**'
      - 'internal/**'
      - 'tools/verification/overview-ci-performance/**'
      - 'tools/verification/native_replay.py'
      - 'tools/verification/NativeReplayIsolation.swift'
      - '.github/workflows/overview-performance.yml'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Full baseline product commit SHA'
        required: true
        type: string
      candidate:
        description: 'Full candidate product commit SHA'
        required: true
        type: string

permissions:
  contents: read

# Independent of ordinary CI; preserve an already running experiment and never
# cancel another PR's verification. AB/BA runs are serial inside one runner.
concurrency:
  group: overview-performance-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  paired-release:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'perf/overview') }}
    name: Release A/B · foreground Overview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      BASELINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the local Release pair for this harness revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/macos-signoff-gate.py overview
