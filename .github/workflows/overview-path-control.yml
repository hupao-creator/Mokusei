name: Overview staged-path control

"on":
  push:
    branches: [diag/overview-ci-path-20261031]

permissions:
  contents: read

concurrency:
  group: overview-path-control-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  staged-paths:
    if: ${{ github.ref == 'refs/heads/diag/overview-ci-path-20261031' }}
    name: Fixed product · single build · P/Q paths
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare the unchanged Release toolchain and display policy
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          xcrun swift --version
          go version
          if ! xcrun --sdk macosx metal --version; then
            python3 scripts/ci/deadline.py xcodebuild -downloadComponent MetalToolchain
          fi
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
      - name: Verify original clock and diagnostic package contracts
        run: |
          python3 -m unittest discover -s tools/verification/overview-ci-performance -p test_clock_contract.py -v \
            2>&1 | tee "$RUNNER_TEMP/overview-path-clock-python.log"
          python3 -m unittest discover -s tools/verification/overview-ci-performance -p test_path_control.py -v \
            2>&1 | tee "$RUNNER_TEMP/overview-path-packages-python.log"
          go test ./tools/verification/overview-ci-performance/runtime \
            2>&1 | tee "$RUNNER_TEMP/overview-path-clock-go.log"
      - name: Measure the eight prespecified S4 path cells
        run: |
          python3 tools/verification/overview-ci-performance/path_control.py \
            --output "$RUNNER_TEMP/overview-path-control" \
            --configure-display --time-budget-seconds 1500
      - name: Publish the complete diagnostic report
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/overview-path-control/report.md" ]]; then
            cat "$RUNNER_TEMP/overview-path-control/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/overview-path-control"
            printf '%s\n' 'The control did not start; inspect setup logs. No CPU result is certified.' \
              > "$RUNNER_TEMP/overview-path-control/not-started.txt"
          fi
          for log in "$RUNNER_TEMP"/overview-path-*.log; do
            if [[ -f "$log" ]]; then cp "$log" "$RUNNER_TEMP/overview-path-control/"; fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: overview-staged-path-control-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overview-path-control
          if-no-files-found: error
          retention-days: 14
